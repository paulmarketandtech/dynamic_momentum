<h4>52-Week Highs/Lows</h4>

<article>
    <form class="control-row"
          hx-get="/web/partials/breakouts"
          hx-target="#breakouts-container"
          hx-trigger="submit, change from:#n_days">
        <div style="min-width: 180px;">
            <label for="n_days">Lookback Window</label>
            <select id="n_days" name="n">
                <option value="1">Last 1 Day</option>
                <option value="3">Last 3 Days</option>
                <option value="5" selected>Last 5 Days</option>
                <option value="10">Last 10 Days</option>
            </select>
        </div>
        <div><button type="submit" class="secondary">Apply</button></div>
    </form>
    <div id="breakouts-container">
        {% include "partials/breakouts_table.html" %}
    </div>
</article>
