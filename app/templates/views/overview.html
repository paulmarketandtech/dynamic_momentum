<h4>Benchmark YTD & 52-Week Breakouts</h4>

<article>
    <header><strong>YTD Cumulative Return (SPY & QQQ Benchmarks)</strong></header>
    <form class="control-row"
          hx-get="/web/partials/ytd-chart"
          hx-target="#ytd-chart-container">
        <div style="flex: 1; min-width: 240px;">
            <label for="extra_tickers">Compare Extra Tickers</label>
            <input type="text" id="extra_tickers" name="tickers" placeholder="e.g. NVDA, AAPL, MSFT">
        </div>
        <div><button type="submit">Plot Chart</button></div>
    </form>
    <div id="ytd-chart-container">
        {% include "partials/ytd_chart.html" %}
    </div>
</article>

<article>
    <header><strong>52-Week Breakouts</strong></header>
    <form class="control-row"
          hx-get="/web/partials/breakouts"
          hx-target="#breakouts-container"
          hx-trigger="submit, change from:#n_days">
        <div style="min-width: 180px;">
            <label for="n_days">Lookback Window</label>
            <select id="n_days" name="n">
                <option value="1">Last 1 Day</option>
                <option value="3">Last 3 Days</option>
                <option value="5" selected>Last 5 Days</option>
                <option value="10">Last 10 Days</option>
            </select>
        </div>
        <div><button type="submit" class="secondary">Apply</button></div>
    </form>
    <div id="breakouts-container">
        {% include "partials/breakouts_table.html" %}
    </div>
</article>
