[project]
name = "dynamic-momentum"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "fastapi-swagger-dark>=0.0.9",
    "fastapi[standard]>=0.143.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "pytest>=9.2.0",
]
